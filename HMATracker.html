<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMATracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;background:#f0f3f8;color:#1a1a2e;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:1280px;margin:0 auto;background:#fff;box-shadow:0 0 60px rgba(31,56,100,0.12);border-radius:0}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 28px;background:#fff;border-bottom:3px solid #1f3864;box-shadow:0 2px 16px rgba(31,56,100,0.10)}
.topbar-logo{height:68px;width:auto;object-fit:contain;flex-shrink:0}
.topbar-text{display:flex;flex-direction:column;justify-content:center}
.topbar-title{font-size:21px;font-weight:900;color:#1f3864;letter-spacing:-0.02em;line-height:1.1}
.nav{display:flex;gap:4px;padding:8px 28px;background:#1f3864;border-bottom:none}
.nav-btn{padding:7px 18px;border-radius:5px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:rgba(255,255,255,0.60);font-family:inherit;transition:all 0.15s;letter-spacing:0.01em}
.nav-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
.nav-btn.active{background:#fff;color:#1f3864}
.content{padding:24px 28px;flex:1}
.section-title{font-size:13px;font-weight:800;margin-bottom:12px;color:#1f3864;text-transform:uppercase;letter-spacing:0.05em}
.card{background:#fff;border:1px solid #e0e4ea;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(31,56,100,0.06)}
.card-blue{border-left:4px solid #1f3864}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.04em}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#1a1a2e;font-size:13px;font-family:inherit;transition:border-color 0.15s}
input:focus,select:focus{outline:none;border-color:#1f3864;box-shadow:0 0 0 3px rgba(31,56,100,0.08)}
input[readonly]{background:#f5f6f8;color:#666;font-weight:500}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.btn{padding:8px 18px;border-radius:6px;border:1px solid #d0d5dd;background:#fff;color:#1a1a2e;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:all 0.15s}
.btn:hover{background:#f0f2f5;border-color:#bbb}
.btn-primary{background:#1f3864;border-color:#1f3864;color:#fff}
.btn-primary:hover{background:#162d52;border-color:#162d52}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:#fff0f0;border-color:#ffc7c7;color:#c0392b}
.btn-danger:hover{background:#ffe0e0}
.btn-success{background:#f0fff4;border-color:#a7f3a7;color:#1a7a1a}
.divider{border:none;border-top:1px solid #eee;margin:14px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.badge-sp{background:#e8f0fe;color:#1f3864}
.badge-ms{background:#e8f8e8;color:#1a6b1a}
.badge-sma{background:#f0e6ff;color:#5b21b6}
.badge-ok{background:#e8f8e8;color:#1a6b1a}
.badge-border{background:#fff8e0;color:#8a6000}
.badge-fail{background:#fff0f0;color:#c0392b}
.grad-table{width:100%;border-collapse:collapse;font-size:12px}
.grad-table th{background:#1f3864;color:#fff;padding:7px 8px;text-align:center;font-weight:500;font-size:11px}
.grad-table th.left{text-align:left}
.grad-table td{padding:5px 8px;text-align:center;border-bottom:1px solid #eee}
.grad-table td.left{text-align:left;font-size:12px;color:#444}
.grad-table tr:nth-child(even) td{background:#fafbfc}
.cell-pass{background:#c6efce!important;color:#375623;font-weight:700;font-size:11px}
.cell-border{background:#ffeb9c!important;color:#7d5a00;font-weight:700;font-size:11px}
.cell-fail{background:#ffc7ce!important;color:#9c0006;font-weight:700;font-size:11px}
.cell-na{color:#aaa}
.ac-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;margin-top:8px;font-size:13px;font-weight:500}
.ac-bar.ok{background:#c6efce;border:1px solid #a0d9a0;color:#1a6b1a}
.ac-bar.border{background:#ffeb9c;border:1px solid #e0c040;color:#7d5a00}
.ac-bar.fail{background:#ffc7ce;border:1px solid #e08080;color:#9c0006}
.ac-bar.pending{background:#f0f2f5;border:1px solid #dde1e7;color:#888}
.lab-table{width:100%;border-collapse:collapse;font-size:12px}
.lab-table th{background:#1f3864;color:#fff;padding:7px 10px;text-align:center;font-weight:600;font-size:12px}
.lab-table th.prop{text-align:left}
.lab-table td{padding:5px 8px;border-bottom:1px solid #eee;text-align:center;vertical-align:middle}
.lab-table td.prop{text-align:left;font-size:12px;color:#555}
.lab-table td.calc{background:#f5f6f8;font-weight:500}
.lab-table td.avg-cell{background:#1f3864;color:#fff;font-weight:700}
.lab-table input[type=number]{width:100%;padding:4px 6px;font-size:12px;text-align:center;box-sizing:border-box}
.lab-table .shdr td{background:#e8edf5;font-weight:700;font-size:11px;padding:5px 10px;color:#1f3864;letter-spacing:0.04em;text-align:left}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.metric-card{background:linear-gradient(135deg,#f5f8ff 0%,#edf1fb 100%);border-radius:10px;padding:14px;text-align:center;border:1px solid #d4dcf0;box-shadow:0 1px 3px rgba(31,56,100,0.07)}
.metric-label{font-size:11px;color:#888;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.metric-value{font-size:24px;font-weight:900;color:#1f3864}
.records-table{width:100%;border-collapse:collapse;font-size:12px}
.records-table th{background:#1f3864;color:#fff;padding:9px 12px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.06em}
.records-table td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:middle}
.records-table tr:hover td{background:#f5f8ff}
.empty-state{text-align:center;padding:50px;color:#aaa;font-size:13px}
.alert-success{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;background:#c6efce;color:#1a6b1a;border:1px solid #a0d9a0;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jmf-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0;align-items:center;padding:8px 16px;border-bottom:1px solid #e8edf5}
.jmf-row input[type=number]{text-align:center;width:100%}
.jmf-row:last-child{border-bottom:none}
.jmf-header{display:grid;grid-template-columns:2fr 1fr 1fr;padding:10px 16px;background:#1f3864;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}.jmf-table{max-width:500px;margin:12px auto 0;border-radius:10px;overflow:hidden;border:1px solid #dde3ed;box-shadow:0 2px 8px rgba(31,56,100,0.08)}.jmf-row:nth-child(even){background:#f4f7ff}.jmf-row:nth-child(odd){background:#fff}.jmf-header span,.jmf-row span:not(:first-child){text-align:center}.jmf-tol{font-size:11px;color:#5a6a82;text-align:center;font-weight:600}
.gyration-box{background:#e8edf5;border:1px solid #c8d4e8;border-radius:8px;padding:10px 16px;display:flex;gap:24px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.gyration-item{text-align:center}
.gyration-label{font-size:10px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.gyration-value{font-size:20px;font-weight:700;color:#1f3864}
.type-selector{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px 8px;border-radius:8px;border:1px solid #d0d5dd;background:#f5f6f8;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;text-align:center;color:#666;transition:all 0.15s}
.type-btn.active-sp{background:#1f3864;border-color:#1f3864;color:#fff}
.type-btn.active-ms{background:#1a6b1a;border-color:#1a6b1a;color:#fff}
.type-btn.active-sma{background:#5b21b6;border-color:#5b21b6;color:#fff}
.info-note{font-size:11px;color:#666;padding:7px 11px;background:#f5f8ff;border-radius:6px;border-left:3px solid #1f3864;margin-bottom:10px}
.entry-col{color:#1f3864;font-weight:700}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.checkbox-col{width:36px;text-align:center}
input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#1f3864}
.summary-panel{background:#1f3864;color:#fff;border-radius:10px;padding:18px;margin-bottom:14px}
.summary-panel h3{font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:0.02em}
.sum-table{width:100%;border-collapse:collapse;font-size:12px}
.sum-table th{background:rgba(255,255,255,0.15);color:#fff;padding:7px 10px;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.sum-table th.left{text-align:left}
.sum-table td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center;color:#dce8ff}
.sum-table td.left{text-align:left;color:#fff;font-weight:600}
.sum-table tr:last-child td{border-bottom:none}
.step-indicator{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.pdf-upload-card{display:flex;align-items:center;gap:16px;padding:16px 20px;background:linear-gradient(135deg,#f0f5ff,#e8edf8);border:2px dashed #8aa0cc;border-radius:10px;margin-bottom:18px;cursor:default}
.pdf-upload-icon{font-size:32px;flex-shrink:0}
.pdf-upload-text{flex:1;display:flex;flex-direction:column;gap:3px}
.pdf-upload-text strong{font-size:13px;color:#1f3864;font-weight:700}
.pdf-upload-text span{font-size:11px;color:#666}
.pdf-upload-btn{padding:8px 18px;background:#1f3864;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;transition:background 0.15s}
.pdf-upload-btn:hover{background:#162d52}
.pdf-status-loading{padding:12px 16px;background:#fff8e0;border:1px solid #e0c040;border-radius:8px;font-size:13px;color:#7d5a00;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pdf-status-success{padding:12px 16px;background:#c6efce;border:1px solid #a0d9a0;border-radius:8px;font-size:13px;color:#1a6b1a;margin-bottom:14px;font-weight:500}
.pdf-status-error{padding:12px 16px;background:#ffc7ce;border:1px solid #e08080;border-radius:8px;font-size:13px;color:#9c0006;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid #e0c040;border-top-color:#7d5a00;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}

</style>
</head>

function _updateACMixTotals(){
  const devs=_acMixAvgsDevs;
  const n=devs.length;
  let totalTon=0,totalMass=0;
  for(let i=0;i<n;i++){
    const ton=parseFloat(document.getElementById('acmt-ton-'+i)?.value)||0;
    const mass=(devs[i]/100)*ton;
    const massEl=document.getElementById('acmt-mass-'+i);
    if(massEl)massEl.textContent=ton?mass.toFixed(4):'—';
    totalTon+=ton;totalMass+=mass;
  }
  const wTon=document.getElementById('acmt-w-ton');
  const wMass=document.getElementById('acmt-w-mass');
  const wDev=document.getElementById('acmt-w-dev');
  if(wTon)wTon.textContent=totalTon?totalTon.toLocaleString():'—';
  if(wMass)wMass.textContent=totalTon?totalMass.toFixed(4):'—';
  if(wDev){
    if(totalTon){
      const wd=(totalMass/totalTon)*100;
      const c=Math.abs(wd)>0.5?'#c0392b':Math.abs(wd)>0.3?'#8a6000':'#1a6b1a';
      wDev.textContent=(wd>=0?'+':'')+wd.toFixed(4);
      wDev.style.color=c;
    } else{wDev.textContent='—';wDev.style.color='';}
  }
}

// ── DATA LOADING ──────────────────────────────────────────────────────────────
async function loadFromSupabase(){
  const [mds,trs,ctrs,pns,cmds]=await Promise.all([
    _db.from('mix_designs').select('*').order('created_at'),
    _db.from('test_records').select('*').order('sample_id',{ascending:true,nullsFirst:false}),
    _db.from('contracts').select('id,contract_number,year').order('year',{ascending:false}),
    _db.from('production_notes').select('*,mix_designs(mix_number),contracts(contract_number)').order('note_date',{ascending:false}),
    _db.from('contract_mix_designs').select('id,mix_design_id,contract_id').order('created_at'),
  ]);
  if(mds.error)console.error('mix_designs:',mds.error);
  if(trs.error)console.error('test_records:',trs.error);
  if(ctrs.error)console.error('contracts:',ctrs.error);
  if(pns.error)console.error('production_notes:',pns.error);
  if(cmds.error)console.error('contract_mix_designs:',cmds.error);
  db.jmfs=(mds.data||[]).map(supabaseMixDesignToJmf);
  db.records=(trs.data||[]).map(supabaseTestRecordToRecord);
  db.contracts=ctrs.data||[];
  db.contractMixDesigns=cmds.data||[];
  // Separate flask-tare sentinel record from real production notes
  const allNotes=pns.data||[];
  const flaskRow=allNotes.find(n=>n.category==='__flask_tares__');
  db.productionNotes=allNotes.filter(n=>n.category!=='__flask_tares__');
  db.flaskTareNoteId=flaskRow?flaskRow.id:null;
  if(flaskRow?.note){
    try{localStorage.setItem('hma_flask_weights',flaskRow.note);}catch(e){}
  }
}

async function cleanupDuplicates(){
  const groups={};
  for(const r of db.records){
    if(!r.sampleId)continue;
    if(!groups[r.sampleId])groups[r.sampleId]=[];
    groups[r.sampleId].push(r);
  }
  const dupes=Object.entries(groups).filter(([,recs])=>recs.length>1);
  if(!dupes.length){alert('No duplicate sample IDs found.');return;}
  const summary=dupes.map(([sid,recs])=>`Sample #${sid}: ${recs.length} copies`).join('\n');
  const ok=confirm(`Found duplicates:\n\n${summary}\n\nFor each group, the most complete record will be kept and the rest deleted. Continue?`);
  if(!ok)return;
  let deleted=0;
  for(const [,recs] of dupes){
    // Score by completeness — prefer records with full gradation/volumetrics over quick-entry stubs
    const scored=recs.map(r=>({r,score:(r.airVoids?3:0)+(r.vma?2:0)+(Object.keys(r.gradActual||{}).length>0?4:0)+(r.briquettes?.length>0?1:0)}));
    scored.sort((a,b)=>b.score-a.score);
    const toDelete=scored.slice(1).map(x=>x.r.id);
    for(const id of toDelete){
      await _db.from('test_records').delete().eq('id',id);
      deleted++;
    }
  }
  await loadFromSupabase();renderView();
  alert(`Done. Removed ${deleted} duplicate record${deleted!==1?'s':''}.`);
}

  if(cf)recs=recs.filter(r=>(r.contractNo||'').toLowerCase().includes(cf)||(r.job||'').toLowerCase().includes(cf));

      const _jmf=r.jmfId?db.jmfs.find(j=>j.id===r.jmfId):null;

      const resultAC=parseFloat(r.acContent);

        <td><strong>${r.contractNo||'—'}</strong></td>

        <td style="text-align:center;font-weight:600;color:${vmaColor}">${r.vma?r.vma+'%':'—'}</td>
        <td style="text-align:center;font-weight:600;color:${acColor}">${resultAC>0?resultAC.toFixed(2)+'%':'—'}${dev!==null?` <span style="font-size:10px;font-weight:700;color:${devColor}">(${dev>=0?'+':''}${dev.toFixed(2)}%)</span>`:''}</td>

          <button class="btn btn-sm" onclick="printRecord('${r.id}')" title="Print">&#128424;</button>
          <button class="btn btn-sm btn-danger" onclick="deleteRecord('${r.id}')" title="Delete" style="margin-left:2px">&#128465;</button>
        </td>

    }).join('')}</tbody></table>`;
}

async function deleteRecord(id){
  if(!confirm('Delete this test record? This cannot be undone.'))return;

  if(error){alert('Delete failed: '+error.message);return;}
  db.records=db.records.filter(r=>r.id!==id);

  if(ct)ct.textContent=db.records.length+' records';
}

function getDLS(mixType){
  if(!mixType)return'9.5';
  const mt=mixType.toUpperCase();
  // OPSS.MUNI 310 Table 1 — Designated Large Sieve by Mix Type
  if(mt.includes('SP 4.75')||mt.includes('SP4.75'))return'2.36';
  if(mt.includes('SP 9.5')||mt.includes('SP9.5'))return'4.75';
  if(mt.includes('SP 12.5')||mt.includes('SP12.5'))return'9.5';
  if(mt.includes('SP 19')||mt.includes('SP19'))return'12.5';
  if(mt.includes('SP 25')||mt.includes('SP25'))return'19.0';
  if(mt.includes('SMA 9.5')||mt.includes('SMA9.5'))return'4.75';
  if(mt.includes('SMA 12.5')||mt.includes('SMA12.5'))return'9.5';
  if(mt.includes('HL1'))return'9.5';
  if(mt.includes('HL2'))return'2.36';
  if(mt.includes('HL3'))return'9.5';
  if(mt.includes('HL4'))return'13.2';
  if(mt.includes('HL8'))return'16.0';
  if(mt.includes('MDBC')||mt.includes('HDBC'))return'16.0';
  if(mt.includes('DFC'))return'9.5';
  return'9.5';
}
function isKeySieve(sieve,dls){const s=String(parseFloat(sieve));return s===String(parseFloat(dls))||s==='4.75'||s==='0.6'||s==='0.075';}
function getGradTol(sieve,isSurface,dls){if(dls&&!isKeySieve(sieve,dls))return null;const s=parseFloat(sieve);if(s>=4.75)return isSurface?5.0:7.0;if(s>=0.6)return isSurface?3.5:4.5;if(s>=0.075)return 2.0;return null;}

// Global capture-phase: prevent ArrowUp/Down from changing number input values — fires
// before the browser's native spin-button handler so e.preventDefault() actually wins.
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowUp'||e.key==='ArrowDown')&&e.target.type==='number')e.preventDefault();
},true);

// Global: auto-select input content on focus. setTimeout is needed for type=number in
// Chrome/Safari — .select() on a number input only works after a microtask delay.
document.addEventListener('focusin',e=>{
  if(e.target.type==='number'||e.target.type==='text'){
    const t=e.target;setTimeout(()=>{try{t.select();}catch(_){}},0);
  }
});

function sieveKeydown(e,idx){
  if(e.key==='Enter'||e.key==='Tab'||e.key==='ArrowDown'){
    e.preventDefault();
    const inputs=[...document.querySelectorAll('[data-sieve-idx]')];
    const next=inputs.find(el=>+el.dataset.sieveIdx===idx+1);
    if(next){next.focus();next.select();}
    else{const m=document.getElementById('e-mass-orig');if(m){m.focus();m.select();}}
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    const inputs=[...document.querySelectorAll('[data-sieve-idx]')];
    const prev=inputs.find(el=>+el.dataset.sieveIdx===idx-1);
    if(prev){prev.focus();prev.select();}
  }
}

// Column-aware Tab / ArrowDown / ArrowUp navigation for multi-column tables.
// Inputs must have data-nav-group, data-nav-col, data-nav-row attributes.
function tableKeydown(e){
  if(e.key!=='Tab'&&e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();
  const group=e.target.dataset.navGroup;
  const col=parseInt(e.target.dataset.navCol);
  const row=parseInt(e.target.dataset.navRow);
  let next=null;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    // Move to same row in adjacent column
    const dir=e.key==='ArrowRight'?1:-1;
    next=document.querySelector(`[data-nav-group="${group}"][data-nav-col="${col+dir}"][data-nav-row="${row}"]`);
  } else {
    const dir=e.key==='ArrowUp'?-1:1;
    // Try next/prev row in same column first
    next=document.querySelector(`[data-nav-group="${group}"][data-nav-col="${col}"][data-nav-row="${row+dir}"]`);
    if(!next){
      // Wrap to next/prev column
      const nextCol=col+dir;
      if(dir>0) next=document.querySelector(`[data-nav-group="${group}"][data-nav-col="${nextCol}"][data-nav-row="0"]`);
      else{const all=document.querySelectorAll(`[data-nav-group="${group}"][data-nav-col="${nextCol}"]`);next=all[all.length-1]||null;}
    }
  }
  if(next){next.focus();next.select();}
}
function recalcGrad(){
  const sieves=getSieves(entryData.testFamily);const jmf=entryData.jmf;const isSurface=jmf?(jmf.courseType||'surface')==='surface':true;const dls=getDLS(entryData.mixType);
  const massOrig=parseFloat(document.getElementById('e-mass-orig').value)||0;
  const massDry=parseFloat(document.getElementById('e-mass-dry').value)||0;
  const jmfAC=parseFloat(document.getElementById('e-jmf-ac').value)||0;
  const acBar=document.getElementById('ac-status-bar');const acText=document.getElementById('ac-status-text');const acInput=document.getElementById('e-ac-content');
  if(massOrig>0&&massDry>0&&massDry<massOrig){
    const acPct=(massOrig-massDry)/massOrig*100;acInput.value=acPct.toFixed(2);
    if(jmfAC>0){const diff=acPct-jmfAC;const abs=Math.abs(diff);const sign=diff>=0?'+':'';
      if(abs<0.30){acBar.className='ac-bar ok';acText.innerHTML=`<strong>AC: ${acPct.toFixed(2)}% | Mix Design: ${jmfAC.toFixed(2)}% | Diff: ${sign}${diff.toFixed(2)}%</strong> &nbsp; ✓ ACCEPTABLE`;}
      else if(abs<=0.50){acBar.className='ac-bar border';acText.innerHTML=`<strong>AC: ${acPct.toFixed(2)}% | Mix Design: ${jmfAC.toFixed(2)}% | Diff: ${sign}${diff.toFixed(2)}%</strong> &nbsp; ⚠ BORDERLINE`;}
      else{acBar.className='ac-bar fail';acText.innerHTML=`<strong>AC: ${acPct.toFixed(2)}% | Mix Design: ${jmfAC.toFixed(2)}% | Diff: ${sign}${diff.toFixed(2)}%</strong> &nbsp; ✗ REJECTABLE`;}
    }else{acBar.className='ac-bar pending';acText.textContent=`AC: ${acPct.toFixed(2)}% — enter Mix Design target to see status`;}
  }else{acBar.className='ac-bar pending';acText.textContent='Enter masses to calculate AC%';acInput.value='';}
  const totalDry=massDry>0?massDry:massOrig;
  sieves.forEach(s=>{
    const cr=parseFloat(document.getElementById('cr-'+s)?.value)||0;
    const passCell=document.getElementById('pct-pass-'+s);const diffCell=document.getElementById('diff-'+s);const statCell=document.getElementById('stat-'+s);
    if(totalDry>0){
      const pctPass=100-(cr/totalDry*100);if(passCell)passCell.textContent=pctPass.toFixed(1)+'%';
      const jmfVal=jmf&&jmf.gradation&&jmf.gradation[s]?parseFloat(jmf.gradation[s]):null;
      if(jmfVal!==null&&diffCell&&statCell){const diff=pctPass-jmfVal,abs=Math.abs(diff),tol=getGradTol(s,isSurface,dls);diffCell.textContent=(diff>=0?'+':'')+diff.toFixed(1)+'%';
        if(tol){if(abs<tol){diffCell.className='cell-pass';statCell.className='cell-pass';statCell.textContent='OK';}else if(abs<=tol*1.5){diffCell.className='cell-border';statCell.className='cell-border';statCell.textContent='BORDER';}else{diffCell.className='cell-fail';statCell.className='cell-fail';statCell.textContent='REJECT';}}
        else{diffCell.className='';statCell.className='cell-na';statCell.textContent='—';}
      }else{if(diffCell){diffCell.className='cell-na';diffCell.textContent='—';}if(statCell){statCell.className='cell-na';statCell.textContent='—';}}
    }else{if(passCell)passCell.textContent='—';if(diffCell){diffCell.className='cell-na';diffCell.textContent='—';}if(statCell){statCell.className='cell-na';statCell.textContent='—';}}
  });
}

function recalcVol(){
  const fam=entryData.testFamily;const isSGC=(fam==='Superpave'||fam==='SMA');const nBriq=isSGC?2:3;
  const gsb=parseFloat(document.getElementById('e-gsb')?.value)||2.680;
  const acPct=parseFloat(document.getElementById('e-acpct')?.value)||parseFloat(entryData.acContent)||0;
  const fw=getFlaskWeights();

  // BRD — compute from raw measurements
  const gmbArr=Array(nBriq).fill(0),brdVolArr=Array(nBriq).fill(0);
  for(let i=0;i<nBriq;i++){
    const a1=parseFloat(document.getElementById('b'+i+'-a1')?.value)||0;
    const a2=parseFloat(document.getElementById('b'+i+'-a2')?.value)||0;
    const a3=parseFloat(document.getElementById('b'+i+'-a3')?.value)||0;
    if(a2>0&&a3>0&&a2>a3){
      const vol=a2-a3;
      setText('b'+i+'-vol',vol.toFixed(1));
      if(a1>0){const gmb=a1/vol;setText('b'+i+'-gmb',roundUp(gmb,3));gmbArr[i]=gmb;brdVolArr[i]=vol;}
      else setText('b'+i+'-gmb','—');
    }else{setText('b'+i+'-vol','—');setText('b'+i+'-gmb','—');}
  }
  const gmbs=gmbArr.filter(v=>v>0);const brdVols=brdVolArr.filter(v=>v>0);
  const gmbAvg=gmbs.length?gmbs.reduce((a,b)=>a+b,0)/gmbs.length:0;
  const avgBrdVol=brdVols.length?brdVols.reduce((a,b)=>a+b,0)/brdVols.length:0;
  setText('avg-brd-vol',avgBrdVol>0?avgBrdVol.toFixed(1):'—');
  setText('avg-gmb',gmbAvg>0?roundUp(gmbAvg,3):'—');
  setText('res-gmb',gmbAvg>0?roundUp(gmbAvg,3):'—');

  // MRD — compute from raw measurements + flask tares (4 flasks)
  const gmms=[];
  for(let k=1;k<=4;k++){
    const fA=parseFloat(fw['f'+k+'a'])||0;
    const fW=parseFloat(fw['f'+k+'w'])||0;
    const famix=parseFloat(document.getElementById('r-famix'+k)?.value)||0;
    const famixw=parseFloat(document.getElementById('r-famixw'+k)?.value)||0;
    if(famix>0&&famixw>0&&fA>0&&fW>0){
      const mmix=famix-fA;const mmixw=famixw-fW;const vol=mmix-mmixw;
      setText('r-mmix'+k,mmix.toFixed(1));setText('r-mmixw'+k,mmixw.toFixed(1));setText('r-vol'+k,vol.toFixed(1));
      if(vol>0){const gmm=mmix/vol;setText('r-gmm'+k,roundUp(gmm,3));gmms.push(gmm);}
      else setText('r-gmm'+k,'—');
    }else{setText('r-mmix'+k,'—');setText('r-mmixw'+k,'—');setText('r-vol'+k,'—');setText('r-gmm'+k,'—');}
  }
  const gmmAvg=gmms.length?gmms.reduce((a,b)=>a+b,0)/gmms.length:0;
  setText('avg-gmm',gmmAvg>0?roundUp(gmmAvg,3):'—');
  setText('res-gmm',gmmAvg>0?roundUp(gmmAvg,3):'—');

  // Summary
  if(gmmAvg>0&&gmbAvg>0){
    const av=(1-gmbAvg/gmmAvg)*100;const vma=gsb>0?(1-gmbAvg*(1-acPct/100)/gsb)*100:0;const vfa=vma>0?(vma-av)/vma*100:0;
    const avCol=av>=3.0&&av<=5.0?'#c6efce':av>=2.0&&av<=6.0?'#ffeb9c':'#ffc7ce';
    setHTML('res-av',`<span style="background:${avCol};padding:2px 6px;border-radius:4px;color:#333">${roundUp(av,1)}%</span>`);
    setText('res-vma',roundUp(vma,1)+'%');setText('res-vfa',roundUp(vfa,1)+'%');
  }

  // SGC heights
  if(isSGC&&gmmAvg>0){
    const np=[],ndp=[];
    for(let i=0;i<nBriq;i++){
      const gmb=gmbArr[i]||0;const hi=parseFloat(document.getElementById('b'+i+'-hini')?.value)||0;const hd=parseFloat(document.getElementById('b'+i+'-hdes')?.value)||0;
      if(gmb>0&&hi>0&&hd>0){const ni=gmb/gmmAvg*(hd/hi)*100;const nd=gmb/gmmAvg*100;setText('b'+i+'-nini-pct',roundUp(ni,1)+'%');setText('b'+i+'-ndes-pct',roundUp(nd,1)+'%');np.push(ni);ndp.push(nd);}
      else{setText('b'+i+'-nini-pct','—');setText('b'+i+'-ndes-pct','—');}
    }
    if(np.length){const a=np.reduce((s,v)=>s+v,0)/np.length;setText('avg-nini-pct',roundUp(a,1)+'%');setText('res-nini',roundUp(a,1)+'%');}
    if(ndp.length){const a=ndp.reduce((s,v)=>s+v,0)/ndp.length;setText('avg-ndes-pct',roundUp(a,1)+'%');setText('res-ndes',roundUp(a,1)+'%');}
    // Nmax heights (Superpave only, when Nmax checkbox is ticked)
    if(fam==='Superpave'&&entryData.isNmax){
      const nxp=[];
      for(let i=0;i<nBriq;i++){
        const gmb=gmbArr[i]||0;const hd=parseFloat(document.getElementById('b'+i+'-hdes')?.value)||0;const hn=parseFloat(document.getElementById('b'+i+'-hnmax')?.value)||0;
        if(gmb>0&&hd>0&&hn>0){const nx=gmb*(hd/hn)/gmmAvg*100;setText('b'+i+'-nmax-pct',roundUp(nx,1)+'%');nxp.push(nx);}
        else setText('b'+i+'-nmax-pct','—');
      }
      if(nxp.length){const a=nxp.reduce((s,v)=>s+v,0)/nxp.length;setText('avg-nmax-pct',roundUp(a,1)+'%');setText('res-nmax',roundUp(a,1)+'%');}
    }
  }

  // Marshall corrected stability + flow
  if(!isSGC){
    const stab=parseFloat(document.getElementById('avg-stab-input')?.value)||0;
    const flow=parseFloat(document.getElementById('avg-flow-input')?.value)||0;
    if(stab>0){setText('res-corr-stab',stab.toFixed(0));setText('avg-stab',stab.toFixed(0));}
    if(flow>0){setText('avg-flow',flow.toFixed(2));setText('res-flow',flow.toFixed(2));}
  }
}
function saveVol3(){
  const fam=entryData.testFamily;const isSGC=(fam==='Superpave'||fam==='SMA');const nBriq=isSGC?2:3;
  const fw=getFlaskWeights();
  const d={brd:[],gmb:[],hini:[],hdes:[],mrd:[],gmm1:'',gmm2:'',gmm3:'',gmm4:''};
  for(let i=0;i<nBriq;i++){
    const a1=document.getElementById('b'+i+'-a1')?.value||'';
    const a2=document.getElementById('b'+i+'-a2')?.value||'';
    const a3=document.getElementById('b'+i+'-a3')?.value||'';
    d.brd.push({a1,a2,a3});
    // Compute Gmb for downstream compatibility
    const fa1=parseFloat(a1),fa2=parseFloat(a2),fa3=parseFloat(a3);
    d.gmb.push(fa1>0&&fa2>fa3&&fa2>0?String(roundUp(fa1/(fa2-fa3),3)):'');
    if(isSGC){d.hini.push(document.getElementById('b'+i+'-hini')?.value||'');d.hdes.push(document.getElementById('b'+i+'-hdes')?.value||'');if(entryData.isNmax){if(!d.hnmax)d.hnmax=[];d.hnmax.push(document.getElementById('b'+i+'-hnmax')?.value||'');}}
    else{d.corrStab=document.getElementById('avg-stab-input')?.value||'';d.avgFlow=document.getElementById('avg-flow-input')?.value||'';}
  }
  for(let k=1;k<=4;k++){
    const famix=document.getElementById('r-famix'+k)?.value||'';
    const famix_w=document.getElementById('r-famixw'+k)?.value||'';
    d.mrd.push({famix,famix_w});
    const fA=parseFloat(fw['f'+k+'a'])||0;const fW=parseFloat(fw['f'+k+'w'])||0;
    const fm=parseFloat(famix),fmw=parseFloat(famix_w);
    if(fm>0&&fmw>0&&fA>0&&fW>0){
      const mmix=fm-fA,mmixw=fmw-fW,vol=mmix-mmixw;
      if(vol>0)d['gmm'+k]=String(roundUp(mmix/vol,3));
    }
  }
  d.isNmax=!!entryData.isNmax;
  entryData.vol3Data=d;
  entryData.notes=document.getElementById('e-notes')?.value||'';
}
function setText(id,val){const el=document.getElementById(id);if(el)el.textContent=val;}
function setHTML(id,val){const el=document.getElementById(id);if(el)el.innerHTML=val;}

function evalAV(av,isDFC){if(isDFC)return av>=2.5&&av<=4.5?'acceptable':av>=2.0&&av<=5.0?'borderline':'rejectable';return av>=3.0&&av<=5.0?'acceptable':av>=2.0&&av<=6.0?'borderline':'rejectable';}
function worstSt(s){if(s.includes('rejectable'))return'rejectable';if(s.includes('borderline'))return'borderline';if(s.includes('acceptable'))return'acceptable';return'acceptable';}

async function calcAndSave(){
  saveVol3(); // snapshot DOM → entryData.vol3Data before reading values
  const fam=entryData.testFamily;const isSGC=(fam==='Superpave'||fam==='SMA');const nBriq=isSGC?2:3;const jmf=entryData.jmf;
  const gsb=parseFloat(document.getElementById('e-gsb')?.value)||2.680;
  let niniCount=null,ndesCount=null,niniLimit=null;
  if(fam==='Superpave'&&jmf){const g=GYR[jmf.trafficCat]||{nini:7,ndes:75};niniCount=g.nini;ndesCount=g.ndes;niniLimit=NILIM[jmf.trafficCat]||89.0;}
  else if(fam==='SMA'){niniCount=parseInt(document.getElementById('sma-nini')?.value)||7;ndesCount=parseInt(document.getElementById('sma-ndes')?.value)||75;niniLimit=89.0;}
  // Read computed Gmb/Gmm from vol3Data (populated by saveVol3 above)
  const gmms=[1,2,3,4].map(k=>parseFloat(entryData.vol3Data?.['gmm'+k])||0).filter(v=>v>0);
  const gmmAvg=gmms.length?gmms.reduce((a,b)=>a+b,0)/gmms.length:0;
  const briquettes=[];
  const _corrStab=parseFloat(entryData.vol3Data?.corrStab)||parseFloat(entryData.vol3Data?.avgStab)||0;const _avgFlow=parseFloat(entryData.vol3Data?.avgFlow)||0;
  for(let i=0;i<nBriq;i++){const gmb=parseFloat(entryData.vol3Data?.gmb?.[i])||0;const b={gmb};if(isSGC){b.hini=parseFloat(document.getElementById('b'+i+'-hini')?.value)||0;b.hdes=parseFloat(document.getElementById('b'+i+'-hdes')?.value)||0;b.hnmax=parseFloat(entryData.vol3Data?.hnmax?.[i])||0;}else{b.stab=i===0?_corrStab:0;b.flow=i===0?_avgFlow:0;}briquettes.push(b);}
  const gmbAvg=briquettes.filter(b=>b.gmb>0).reduce((s,b)=>s+b.gmb,0)/Math.max(briquettes.filter(b=>b.gmb>0).length,1);
  const acPct=parseFloat(document.getElementById('e-acpct')?.value)||parseFloat(entryData.acContent)||0;
  const airVoids=gmmAvg>0&&gmbAvg>0?(1-gmbAvg/gmmAvg)*100:0;
  const vma=gsb>0?(1-gmbAvg*(1-acPct/100)/gsb)*100:0;const vfa=vma>0?(vma-airVoids)/vma*100:0;
  let niniPct=null,ndesPct=null,niniStatus=null,nmaxPct=null;
  if(isSGC&&gmmAvg>0){const validB=briquettes.filter(b=>b.hini>0&&b.hdes>0&&b.gmb>0);if(validB.length){const avgHi=validB.reduce((s,b)=>s+b.hini,0)/validB.length,avgHd=validB.reduce((s,b)=>s+b.hdes,0)/validB.length;niniPct=gmbAvg/gmmAvg*(avgHd/avgHi)*100;ndesPct=gmbAvg/gmmAvg*100;niniStatus=niniPct<=(niniLimit||89.0)?'acceptable':niniPct<=NINOTE5?'note5':'rejectable';}
    if(entryData.isNmax){const validN=briquettes.filter(b=>b.hnmax>0&&b.hdes>0&&b.gmb>0);if(validN.length){const avgHn=validN.reduce((s,b)=>s+b.hnmax,0)/validN.length,avgHd=validN.reduce((s,b)=>s+b.hdes,0)/validN.length;nmaxPct=gmbAvg*(avgHd/avgHn)/gmmAvg*100;}}
  }
  const jmfAC=parseFloat(entryData.jmfAC)||0;const acDiff=Math.abs(acPct-jmfAC);const acStatus=jmfAC>0?(acDiff<0.30?'acceptable':acDiff<=0.50?'borderline':'rejectable'):'acceptable';
  const isDFC=(entryData.mixType||'').toUpperCase().includes('DFC');const avStatus=evalAV(airVoids,isDFC);
  const jmfVMA=jmf?parseFloat(jmf.vmaTarget)||0:0;const vmaStatus=jmfVMA>0?(Math.abs(vma-jmfVMA)<1.0?'acceptable':Math.abs(vma-jmfVMA)<2.0?'borderline':'rejectable'):'acceptable';
  const gradWorst=worstSt(Object.values(entryData.gradStatus||{}));
  const overall=worstSt([acStatus,avStatus,gradWorst]);
  const record={
    id:editingRecordId||Date.now().toString(),
    date:entryData.date,dateSampled:entryData.dateSampled||entryData.date,bySampled:entryData.bySampled||'',dateTested:entryData.dateTested||entryData.date,byTested:entryData.byTested||'',season:entryData.season,sampleId:entryData.sampleId,
    job:entryData.job,location:entryData.location,tech:entryData.tech,
    contractNo:entryData.contractNo||'',lot:entryData.lot||'',subLot:entryData.subLot||'',ticketNo:entryData.ticketNo||'',
    mixNo:entryData.mixNo,mixDesignNo:entryData.mixDesignNo||'',mixType:entryData.mixType,testFamily:fam,jmfId:entryData.jmfId||null,jmf:entryData.jmf||null,
    acContent:roundUp(acPct,2),jmfAC:jmfAC>0?roundUp(jmfAC,2):'',acStatus,
    airVoids:roundUp(airVoids,1),vma:roundUp(vma,1),vfa:roundUp(vfa,1),
    jmfVMA:jmfVMA?jmfVMA.toFixed(1):'',vmaStatus,
    gmb:gmbAvg>0?roundUp(gmbAvg,3):'',gmm:gmmAvg>0?roundUp(gmmAvg,3):'',
    isOvernight:entryData.isOvernight||false,isNmax:entryData.isNmax||false,
    niniPct:niniPct?roundUp(niniPct,1):null,ndesPct:ndesPct?roundUp(ndesPct,1):null,nmaxPct:nmaxPct?roundUp(nmaxPct,1):null,
    niniStatus,niniLimit,niniCount,ndesCount,
    gradActual:entryData.gradActual||{},gradStatus:entryData.gradStatus||{},
    cumRetained:entryData.cumRetained||{},massOrig:entryData.massOrig,massDry:entryData.massDry,
    avStatus,overallStatus:overall,briquettes,
    avgFlow:_avgFlow||null,
    corrStab:_corrStab||null,
    notes:document.getElementById('e-notes')?.value?.trim()||entryData.notes||'',
    vol3Data:entryData.vol3Data||null
  };
  // ── Save to Supabase ──────────────────────────────────────────────────────
  const _year=parseInt((record.dateSampled||record.date||'').slice(0,4))||new Date().getFullYear();
  const contractId=await getOrCreateContract(record.contractNo,_year);
  // Link mix design to contract in join table (upsert — safe to call on every save)
  if(contractId&&record.jmfId){
    await _db.from('contract_mix_designs').upsert({
      contract_id:contractId,mix_design_id:record.jmfId,created_by:currentUser?.id
    },{onConflict:'contract_id,mix_design_id',ignoreDuplicates:true});
  }
  const sbPayload={
    mix_design_id:record.jmfId||null,contract_id:contractId,
    sample_id:record.sampleId||null,
    test_date:record.dateSampled||record.date,test_type:'extraction',
    air_voids:parseFloat(record.airVoids)||null,vma:parseFloat(record.vma)||null,
    vfa:parseFloat(record.vfa)||null,binder_content:parseFloat(record.acContent)||null,
    passed_spec:record.overallStatus==='acceptable',
    notes:record.notes||null,
    results:record,entered_by:currentUser?.id,last_modified_by:currentUser?.id,
  };
  let saveErr;
  if(editingRecordId){
    const {error}=await _db.from('test_records').update(sbPayload).eq('id',editingRecordId);saveErr=error;
  } else {
    // Block save if lab sample # already exists
    const existingMatch=record.sampleId?db.records.filter(r=>r.sampleId===record.sampleId):[];
    if(existingMatch.length>0){
      alert(`⛔ Lab sample # ${record.sampleId} already exists in the database.\n\nPlease verify the sample number before saving. If you need to correct an existing record, go to Test Records and use the edit button instead.`);
      return;
    }
    const {error}=await _db.from('test_records').insert(sbPayload);saveErr=error;
  }
  if(saveErr){alert('Save failed: '+saveErr.message);return;}
  await loadFromSupabase();
  const savedRecord=db.records.find(r=>r.sampleId===record.sampleId&&(r.dateSampled||r.date)===(record.dateSampled||record.date))||record;
  editingRecordId=null;entryStep=1;entryData={};
  document.getElementById('main-content').innerHTML=renderSavedResult(savedRecord);
  setTimeout(()=>drawResultChart(savedRecord,'result-chart'),100);
}

function renderSavedResult(r){
  const nc=r.niniStatus==='acceptable'?'#1a6b1a':r.niniStatus==='note5'?'#8a6000':'#c0392b';
  const isQuick=!r.airVoids&&!r.vma&&!r.vfa&&!r.gmb;
  const acColor=r.acStatus==='acceptable'?'#1a6b1a':r.acStatus==='borderline'?'#8a6000':'#c0392b';
  return`<div class="alert-success">✓ ${editingRecordId?'Record updated':'Record saved'} — ${r.sampleId||r.date} — ${r.mixNo} (${r.mixType})</div>
  <div class="card"><div class="section-title">Result summary</div>
  ${isQuick?`<div class="info-note" style="margin-bottom:12px">Quick-entry record — no volumetric or gradation data.</div>`:''}
  <div class="metric-grid">
    ${r.acContent?`<div class="metric-card"><div class="metric-label">AC content</div><div class="metric-value" style="color:${acColor}">${r.acContent}%</div></div>`:''}
    ${r.jmfAC?`<div class="metric-card"><div class="metric-label">Mix Design AC</div><div class="metric-value">${r.jmfAC}%</div></div>`:''}
    ${r.airVoids?`<div class="metric-card"><div class="metric-label">Air voids</div><div class="metric-value" style="color:${r.avStatus==='acceptable'?'#1a6b1a':r.avStatus==='borderline'?'#8a6000':'#c0392b'}">${r.airVoids}%</div></div>`:''}
    ${r.vma?`<div class="metric-card"><div class="metric-label">VMA</div><div class="metric-value" style="color:${r.vmaStatus==='acceptable'?'#1a6b1a':r.vmaStatus==='borderline'?'#8a6000':'#c0392b'}">${r.vma}%</div></div>`:''}
    ${r.jmfVMA?`<div class="metric-card"><div class="metric-label">Mix Design VMA</div><div class="metric-value">${r.jmfVMA}%</div></div>`:''}
    ${r.vfa?`<div class="metric-card"><div class="metric-label">VFA</div><div class="metric-value">${r.vfa}%</div></div>`:''}
    ${r.gmb?`<div class="metric-card"><div class="metric-label">Gmb</div><div class="metric-value">${r.gmb}</div></div>`:''}
    ${r.gmm?`<div class="metric-card"><div class="metric-label">Gmm</div><div class="metric-value">${r.gmm}</div></div>`:''}

    ${r.ndesPct?`<div class="metric-card"><div class="metric-label">%Gmm Ndes (N=${r.ndesCount})</div><div class="metric-value">${r.ndesPct}%</div></div>`:''}
  </div></div>
  ${!isQuick?`<div class="card"><div class="section-title">Gradation chart</div><canvas id="result-chart" style="width:100%;max-height:360px"></canvas></div>`:''}
  <div class="row" style="margin-top:12px">
    ${!isQuick?`<button class="btn btn-primary" onclick="printRecord('${r.id}')">🖨️ Print gradation report</button>`:''}
    <button class="btn" style="border-color:#1f3864;color:#1f3864" onclick="editRecord('${r.id}')">✏️ Edit this record</button>
    <button class="btn" onclick="showView('entry')">New full entry</button>
    <button class="btn" onclick="showView('records')">All records</button>
  </div>`;
}

function drawResultChart(record,canvasId){
  const jmf=record.jmfId?db.jmfs.find(j=>j.id===record.jmfId):null;
  const sieves=getSieves(record.testFamily);const sievesRev=[...sieves].reverse();
  const isMarshall=record.testFamily==='Marshall';
  const xFn=isMarshall?function(mm){return mm;}:function(mm){return Math.pow(mm,0.45);};
  const fieldData=sievesRev.map(s=>{const v=record.gradActual[s]?parseFloat(record.gradActual[s]):null;return v!==null?{x:xFn(parseFloat(s)),y:v}:null;}).filter(p=>p!==null);
  const jmfData=jmf?sievesRev.map(s=>{const v=jmf.gradation&&jmf.gradation[s]?parseFloat(jmf.gradation[s]):null;return v!==null?{x:xFn(parseFloat(s)),y:v}:null;}).filter(p=>p!==null):[];
  const tickX=sievesRev.map(s=>xFn(parseFloat(s)));
  const tickLabels=sievesRev.map(s=>SL[s]||s);
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  if(chartInst){chartInst.destroy();chartInst=null;}
  const datasets=[{label:'Field sample',data:fieldData,borderColor:'#c00000',backgroundColor:'transparent',borderWidth:2,pointRadius:5,tension:0.1}];
  if(jmf&&jmfData.length>0)datasets.push({label:'Mix Design',data:jmfData,borderColor:'#1f3864',backgroundColor:'transparent',borderWidth:2,borderDash:[8,4],pointRadius:3,tension:0.1});
  chartInst=new Chart(canvas,{type:'line',data:{datasets},options:{responsive:true,parsing:false,scales:{x:{type:isMarshall?'logarithmic':'linear',afterBuildTicks:function(axis){axis.ticks=tickX.map(function(v){return{value:v};});},ticks:{font:{size:10},maxRotation:45,callback:function(v,i,all){var idx=tickX.findIndex(function(x){return Math.abs(x-v)/(Math.abs(x)||1)<0.001;});return idx>=0?tickLabels[idx]:'';}},min:tickX[0],max:tickX[tickX.length-1],grid:{color:'rgba(0,0,0,0.05)'},title:{display:true,text:isMarshall?'SEMI-LOG AGGREGATE GRADING CHART':'0.45 POWER AGGREGATE GRADING CHART',font:{size:10}}},y:{min:0,max:103,ticks:{font:{size:10},callback:function(v){return v<=100?v+'%':''}},grid:{color:'rgba(0,0,0,0.05)'},title:{display:true,text:'Percent Passing (%)',font:{size:11}}}},plugins:{legend:{position:'top',align:'start',labels:{font:{size:11},boxWidth:20}}}}});
}

function jmfExpiryChip(designDate){
  if(!designDate) return '<span style="color:#aaa;font-size:11px">—</span>';
  const d=new Date(designDate);
  if(isNaN(d)) return '<span style="color:#aaa;font-size:11px">—</span>';
  const expiry=new Date(d); expiry.setFullYear(expiry.getFullYear()+3);
  const now=new Date();
  const mo=Math.round((expiry-now)/(1000*60*60*24*30.44));
  if(mo<=0) return`<span style="background:#ffc7ce;color:#9c0006;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700">Expired</span>`;
  const bg=mo<3?'#ffc7ce':mo<12?'#ffeb9c':'#c6efce';
  const cl=mo<3?'#9c0006':mo<12?'#7d5a00':'#375623';
  return`<span style="background:${bg};color:${cl};padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700">${mo}mo left</span>`;
}

function cancelJmfEdit(){db.jmfs=db.jmfs.filter(j=>j.id!=='__temp__');editingJmf=null;renderView();}
function setJmfFamily(fam){
  let cur=editingJmf==='new'||editingJmf==='__temp__'?(db.jmfs.find(j=>j.id==='__temp__')||{}):db.jmfs.find(j=>j.id===editingJmf)||{};
  if(editingJmf==='new'){db.jmfs=db.jmfs.filter(j=>j.id!=='__temp__');db.jmfs.push({...cur,testFamily:fam,id:'__temp__'});editingJmf='__temp__';}
  else if(editingJmf==='__temp__'){const idx=db.jmfs.findIndex(j=>j.id==='__temp__');if(idx>=0)db.jmfs[idx]={...db.jmfs[idx],testFamily:fam};}
  else{const idx=db.jmfs.findIndex(j=>j.id===editingJmf);if(idx>=0)db.jmfs[idx]={...db.jmfs[idx],testFamily:fam};}
  renderView();
}
function updateGyrations(){const cat=document.getElementById('jf-trafficcat')?.value;if(!cat)return;const g=GYR[cat];const f=id=>document.getElementById(id);if(f('jf-nini'))f('jf-nini').value=g.nini;if(f('jf-ndes'))f('jf-ndes').value=g.ndes;if(f('jf-nmax'))f('jf-nmax').value=g.nmax;if(f('jf-nini-limit'))f('jf-nini-limit').value='≤'+(NILIM[cat]||89.0)+'%';}
async function saveJMF(){
  const fam=document.querySelector('.type-btn.active-sp')?'Superpave':document.querySelector('.type-btn.active-ms')?'Marshall':document.querySelector('.type-btn.active-sma')?'SMA':'Superpave';
  const sieves=getSieves(fam);const cat=fam==='Superpave'?(document.getElementById('jf-trafficcat')?.value||'C'):'';const g=fam==='Superpave'?(GYR[cat]||{nini:7,ndes:75,nmax:115}):{};
  const gradation={};sieves.forEach(s=>{const v=document.getElementById('jg-'+s)?.value;if(v)gradation[s]=v;});
  const isNew=editingJmf==='new'||editingJmf==='__temp__';
  const mixTypeMap={'Superpave':'superpave','Marshall':'marshall','SMA':'sma'};
  const payload={
    mix_number:document.getElementById('jf-mixno').value,
    mix_type:mixTypeMap[fam]||'superpave',
    binder_content_target:parseFloat(document.getElementById('jf-actarget').value)||null,
    gsb:parseFloat(document.getElementById('jf-gsb').value)||null,
    last_modified_by:currentUser?.id,
    jmf_targets:{
      mixDesignNo:document.getElementById('jf-mixdesignno').value,
      mixType:document.getElementById('jf-mixtype').value,
      trafficCat:cat,binder:document.getElementById('jf-binder').value,
      gb:document.getElementById('jf-gb').value,vmaTarget:document.getElementById('jf-vmatarget').value,
      season:document.getElementById('jf-season').value,
      designDate:document.getElementById('jf-designdate')?.value||'',
      niniGyrations:fam==='SMA'?parseInt(document.getElementById('jf-sma-nini')?.value||7):g.nini||null,
      ndesGyrations:fam==='SMA'?parseInt(document.getElementById('jf-sma-ndes')?.value||75):g.ndes||null,
      nmaxGyrations:g.nmax||null,
      smaGyrNini:fam==='SMA'?parseInt(document.getElementById('jf-sma-nini')?.value||7):null,
      smaGyrNdes:fam==='SMA'?parseInt(document.getElementById('jf-sma-ndes')?.value||75):null,
      gradation,
    },
  };
  let err;
  if(isNew){
    payload.created_by=currentUser?.id;
    const {error}=await _db.from('mix_designs').insert(payload);err=error;
  } else {
    const {error}=await _db.from('mix_designs').update(payload).eq('id',editingJmf);err=error;
  }
  if(err){alert('Save failed: '+err.message);return;}
  editingJmf=null;
  db.jmfs=db.jmfs.filter(j=>j.id!=='__temp__');
  await loadFromSupabase();renderView();
}
function editJMF(id){editingJmf=id;renderView();}
async function deleteJMF(id){
  if(!confirm('Delete this Mix Design? This will also remove it from any linked contracts.'))return;
  // Remove child rows first to avoid foreign key constraint
  const {error:e1}=await _db.from('contract_mix_designs').delete().eq('mix_design_id',id);
  if(e1){alert('Delete failed: '+e1.message);return;}
  const {error:e2}=await _db.from('mix_designs').delete().eq('id',id);
  if(e2){alert('Delete failed: '+e2.message);return;}
  await loadFromSupabase();renderView();
}

function renderJobRegistry(){
  const jmfByMixNo=Object.fromEntries(db.jmfs.map(j=>[j.mixNo,j]));

  const liveYears=db.contracts.map(c=>String(c.year)).filter(Boolean);
  const allYears=[...new Set([...Object.keys(JOB_REGISTRY_DATA),...liveYears])].sort((a,b)=>b-a);
  if(!allYears.length)return`<div class="card"><div class="empty-state">No data found.</div></div>`;
  if(!allYears.includes(jobRegYear))jobRegYear=allYears[0];

  const yearSelect=`<select style="padding:5px 10px;border:1px solid #c8d4e8;border-radius:6px;font-size:14px;color:#1f3864;background:#fff;font-weight:600" onchange="jobRegYear=this.value;renderView()">
    ${allYears.map(y=>`<option value="${y}" ${y===jobRegYear?'selected':''}>${y}</option>`).join('')}

function renderProdNotes(){
  const today=new Date().toISOString().split('T')[0];
  const mixOpts=db.jmfs.map(j=>`<option value="${j.id}">${j.mixNo}${j.mixDesignNo?' / '+j.mixDesignNo:''}</option>`).join('');
  const contractOpts=db.contracts.map(c=>`<option value="${c.id}">${c.contract_number} (${c.year})</option>`).join('');
  const filterOpts='<option value="">All mix designs</option>'+db.jmfs.map(j=>`<option value="${j.id}" ${prodNotesFilterMix===j.id?'selected':''}>${j.mixNo}${j.mixDesignNo?' / '+j.mixDesignNo:''}</option>`).join('');
  return`<div class="card">
    <div class="section-title">Add Production Note</div>
    <div id="pn-success" style="display:none;background:#e8f5e9;color:#1a6b1a;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:600">Note saved successfully</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="form-group"><label>Mix Design</label><select id="pn-mix"><option value="">Select mix design</option>${mixOpts}</select></div>
      <div class="form-group"><label>Contract</label><select id="pn-contract"><option value="">Select contract</option>${contractOpts}</select></div>
    </div>
    <div style="margin-bottom:12px">
      <div class="form-group"><label>Date</label><input type="date" id="pn-date" value="${today}" style="width:180px"></div>
    </div>
    <div class="form-group" style="margin-bottom:14px"><label>Note</label>
      <textarea id="pn-note" rows="4" style="width:100%;border:1px solid #d0d7e3;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box" placeholder="Describe what changed or was observed during production"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveProdNote()">Save note</button>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="section-title" style="margin:0">Past Production Notes</div>
      <select style="font-size:12px;padding:5px 10px;border:1px solid #d0d7e3;border-radius:6px;color:#444" onchange="prodNotesFilterMix=this.value;document.getElementById('pn-list').innerHTML=renderProdNotesList()">${filterOpts}</select>
    </div>
    <div id="pn-list">${renderProdNotesList()}</div>
  </div>`;
}

function renderProdNotesList(){
  let notes=db.productionNotes||[];
  if(prodNotesFilterMix)notes=notes.filter(n=>n.mix_design_id===prodNotesFilterMix);
  if(!notes.length)return'<div class="empty-state">No production notes yet.</div>';
  return notes.map(n=>{
    const mix=n.mix_designs?n.mix_designs.mix_number:'unknown';
    const contract=n.contracts?n.contracts.contract_number:'unknown';
    const cat='';
    return`<div style="padding:12px 0;border-bottom:1px solid #eef0f5">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
        <span style="background:#1f3864;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">${mix}</span>
        <span style="background:#e8edf5;color:#1f3864;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">Contract ${contract}</span>
        ${cat}
        <span style="font-size:11px;color:#aaa;margin-left:auto">${n.note_date}</span>
      </div>
      <div style="font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap">${n.note}</div>
    </div>`;
  }).join('');
}

async function saveProdNote(){
  const mix_design_id=document.getElementById('pn-mix').value;
  const contract_id=document.getElementById('pn-contract').value;
  const note_date=document.getElementById('pn-date').value;
  const category=null;
  const note=document.getElementById('pn-note').value.trim();
  if(!mix_design_id){alert('Please select a mix design.');return;}
  if(!contract_id){alert('Please select a contract.');return;}
  if(!note_date){alert('Please enter a date.');return;}
  if(!note){alert('Note cannot be empty.');return;}
  const btn=document.querySelector('[onclick="saveProdNote()"]');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  const {error}=await _db.from('production_notes').insert({
    mix_design_id,contract_id,note_date,category,note,
    entered_by:currentUser?currentUser.id:null,last_modified_by:currentUser?currentUser.id:null,
  });
  if(btn){btn.disabled=false;btn.textContent='Save note';}
  if(error){alert('Save failed: '+error.message);return;}
  await loadFromSupabase();
  const succ=document.getElementById('pn-success');
  if(succ){succ.style.display='block';setTimeout(function(){if(succ)succ.style.display='none';},3000);}
  document.getElementById('pn-note').value='';
  document.getElementById('pn-list').innerHTML=renderProdNotesList();
}

// ── AC DEVIATION REPORT ───────────────────────────────────────────────────────
function renderACReport(){
  const year=new Date().getFullYear().toString();
  const families=['Superpave','Marshall','SMA'];
  const MNAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const familyTabs=families.map(f=>`<button class="btn ${acReportFamily===f?'btn-primary':''}" style="margin-right:6px" onclick="acReportFamily='${f}';acReportMonth=null;renderView()">${f}</button>`).join('');
  const seasons=[...new Set(db.records.filter(r=>r.testFamily===acReportFamily).map(r=>r.season||'').filter(Boolean))].sort().reverse();
  const seasonOpts=seasons.map(s=>`<option value="${s}" ${acReportYear===s?'selected':''}>${s}</option>`).join('');
  // Month buttons — highlight which months have data
  const yearRecs=db.records.filter(r=>r.testFamily===acReportFamily&&r.season===acReportYear);
  const monthsWithData=new Set(yearRecs.map(r=>(r.dateSampled||r.date||'').slice(5,7)).filter(Boolean).map(Number));
  const monthBtns=MNAMES.map((m,i)=>{
    const mo=i+1;
    const hasData=monthsWithData.has(mo);
    const isActive=acReportMonth===mo;
    const clickHandler=isActive?`acReportMonth=null;renderView()`:`acReportMonth=${mo};loadACTonnage('${acReportYear}',${mo},'${acReportFamily}').then(()=>renderView())`;
    return`<button onclick="${clickHandler}" style="padding:6px 10px;border-radius:6px;border:1px solid ${isActive?'#1f3864':hasData?'#8aa0cc':'#dde3ed'};background:${isActive?'#1f3864':hasData?'#eef2ff':'#f8f9fc'};color:${isActive?'#fff':hasData?'#1f3864':'#aaa'};font-size:12px;font-weight:${isActive||hasData?'700':'400'};cursor:${hasData?'pointer':'default'}">${m}</button>`;
  }).join('');
  // Filter records
  const filteredRecs=db.records.filter(r=>{
    if(r.testFamily!==acReportFamily||r.season!==acReportYear)return false;
    if(acReportMonth!==null){const mo=parseInt((r.dateSampled||r.date||'').slice(5,7));if(mo!==acReportMonth)return false;}
    return true;
  }).sort((a,b)=>(a.dateSampled||a.date||'').localeCompare(b.dateSampled||b.date||''));
  // Augment with deviation
  const recsAug=filteredRecs.map(r=>{
    const jmf=r.jmfId?db.jmfs.find(j=>j.id===r.jmfId):null;
    const designAC=parseFloat(jmf?.acTarget);
    const resultAC=parseFloat(r.acContent);
    const hasAC=resultAC>0;
    const dev=(hasAC&&!isNaN(designAC))?resultAC-designAC:null;
    return{...r,designAC,resultAC,hasAC,dev,jmf};
  });
  const chartTitle=`AC Deviation — ${acReportFamily}${acReportMonth!==null?' / '+MNAMES[acReportMonth-1]:''} ${acReportYear}`;
  // Table rows
  const tableRows=recsAug.map(r=>{
    const dc=r.dev===null?'#888':Math.abs(r.dev)>0.5?'#c0392b':Math.abs(r.dev)>0.3?'#8a6000':'#1a6b1a';
    const rc=r.acStatus==='acceptable'?'#1a6b1a':r.acStatus==='borderline'?'#8a6000':'#c0392b';
    return`<tr>
      <td style="font-weight:700">${r.sampleId||'—'}</td>
      <td>${r.dateSampled||r.date||'—'}</td>
      <td>${r.contractNo||'—'}</td>
      <td>${r.job||'—'}</td>
      <td><span class="badge badge-${r.testFamily==='Marshall'?'ms':r.testFamily==='SMA'?'sma':'sp'}" style="font-size:10px">${r.mixType||'—'}</span></td>
      <td>${r.mixNo||'—'}</td>
      <td style="text-align:center">${!isNaN(r.designAC)&&r.designAC>0?r.designAC.toFixed(2)+'%':'—'}</td>
      <td style="text-align:center;font-weight:600;color:${r.hasAC?rc:'#888'}">${r.hasAC?r.resultAC.toFixed(2)+'%':'N/T'}</td>
      <td style="text-align:center;font-weight:700;color:${dc}">${r.dev!==null?(r.dev>=0?'+':'')+r.dev.toFixed(2):'—'}</td>
    </tr>`;
  }).join('');
  return`
  <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <span style="font-weight:700;color:#1f3864;line-height:32px;margin-right:4px">Mix Design Type:</span>
    ${familyTabs}
    <select onchange="acReportYear=this.value;acReportMonth=null;renderView()" style="margin-left:auto;padding:6px 10px;border-radius:6px;border:1px solid #c8d4e8;font-size:13px;color:#1f3864;background:#fff">${seasonOpts||'<option>—</option>'}</select>
    ${acReportMonth!==null?`<button onclick="printACReport()" class="btn btn-primary" style="padding:6px 14px;font-size:13px">🖨 Print Report</button>`:''}
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">${monthBtns}</div>
  <div class="card" style="margin-bottom:16px">
    <div style="font-size:12px;font-weight:700;color:#1f3864;margin-bottom:10px">${chartTitle}</div>
    <canvas id="ac-dev-chart" style="width:100%;max-height:300px"></canvas>
    ${!recsAug.filter(r=>r.hasAC).length?`<div class="empty-state" style="margin-top:8px">No ${acReportFamily} records with AC data${acReportMonth!==null?' in '+MNAMES[acReportMonth-1]:''}</div>`:''}
  </div>
  ${acReportMonth!==null?renderACMixAvgsTable(recsAug,acReportYear,acReportMonth,acReportFamily):''}
  <div class="card" style="padding:0;overflow:hidden">
    ${!recsAug.length?`<div class="empty-state">No records</div>`:`
    <div style="overflow-x:auto"><table class="records-table">
      <thead><tr>
        <th>Lab #</th><th>Date</th><th>Contract</th><th>Job</th><th>Mix Type</th><th>Mix No.</th>
        <th style="text-align:center">Design AC%</th><th style="text-align:center">Result AC%</th><th style="text-align:center">Deviation</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>`}
  </div>`;
}

let acTonnageCache={};
function _tonCacheKey(year,month,family,mixNo){return`${year}|${month}|${family}|${mixNo}`;}
function _getTon(year,month,family,mixNo){return acTonnageCache[_tonCacheKey(year,month,family,mixNo)]||null;}
async function loadACTonnage(year,month,family){
  const {data}=await _db.from('ac_tonnage').select('mix_no,tonnage').eq('year',year).eq('month',month).eq('family',family);
  acTonnageCache={};
  (data||[]).forEach(r=>{acTonnageCache[_tonCacheKey(year,month,family,r.mix_no)]=r.tonnage;});
}
async function saveACTonnage(year,month,family,mixNo,val){
  const k=_tonCacheKey(year,month,family,mixNo);
  const tonnage=parseFloat(val)||0;
  acTonnageCache[k]=tonnage;
  await _db.from('ac_tonnage').upsert({year:String(year),month:parseInt(month),family,mix_no:mixNo,tonnage,updated_at:new Date().toISOString(),updated_by:currentUser?.name||null},{onConflict:'year,month,family,mix_no'});
}

function renderACMixAvgsTable(recsAug,year,month,family){
  // Group records with AC data by mix number
  const byMix={};
  recsAug.forEach(r=>{
    if(!r.hasAC||r.dev===null)return;
    const k=r.mixNo||'—';
    if(!byMix[k])byMix[k]={devs:[],count:0};
    byMix[k].devs.push(r.dev);
    byMix[k].count++;
  });
  const mixes=Object.keys(byMix).sort();
  if(!mixes.length)return'';
  const MNAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const cellSt='padding:8px 12px;text-align:center;border:1px solid #e0e8f0;';
  const labelSt='padding:8px 12px;font-weight:700;background:#fff9c4;border:1px solid #e0e8f0;white-space:nowrap;';
  const wCellSt='padding:8px 12px;text-align:center;border:1px solid #e0e8f0;background:#fff3cd;font-weight:700;';
  // Header row
  const headerCols=mixes.map(m=>`<th style="${cellSt}background:#1f3864;color:#fff;font-weight:700">${m}</th>`).join('');
  // AC% Dev row
  const avgDevs=mixes.map(m=>(byMix[m].devs.reduce((a,b)=>a+b,0)/byMix[m].devs.length));
  const devCols=avgDevs.map((d,i)=>{
    const c=Math.abs(d)>0.5?'#c0392b':Math.abs(d)>0.3?'#8a6000':'#1a6b1a';
    return`<td style="${cellSt}font-weight:700;color:${c}" id="acmt-dev-${i}">${(d>=0?'+':'')+d.toFixed(2)}</td>`;
  }).join('');
  // Tonnage row (editable)
  const tonCols=mixes.map((m,i)=>{
    const stored=_getTon(year,month,family,m)||'';
    return`<td style="${cellSt}padding:4px 6px"><input type="number" min="0" step="1" value="${stored}" placeholder="0"
      style="width:80px;text-align:center;border:1px solid #c8d4e8;border-radius:4px;padding:4px 6px;font-size:12px;font-weight:700"
      oninput="saveACTonnage('${year}',${month},'${family}','${m}',this.value);_updateACMixTotals()" id="acmt-ton-${i}"></td>`;
  }).join('');
  // AC Mass row
  const massCols=mixes.map((_,i)=>`<td style="${cellSt}" id="acmt-mass-${i}">—</td>`).join('');
  // No. Tests row
  const testCols=mixes.map(m=>`<td style="${cellSt}">${byMix[m].count}</td>`).join('');
  const totalTests=mixes.reduce((a,m)=>a+byMix[m].count,0);
  _acMixAvgsDevs=avgDevs;
  return`<div id="ac-mix-avgs-card" class="card" style="margin-bottom:16px;overflow-x:auto">
    <div style="font-size:12px;font-weight:700;color:#1f3864;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em">
      Mix Averages — ${MNAMES[month-1]} ${year} — ${family}
      <span style="font-size:10px;color:#888;font-weight:400;margin-left:8px">Enter tonnage per mix to calculate weighted deviation</span>
    </div>
    <table style="border-collapse:collapse;font-size:13px;min-width:100%">
      <thead><tr>
        <th style="${labelSt}background:#1f3864;color:#fff">Mix Avgs.</th>
        ${headerCols}
        <th style="${wCellSt}background:#e6a817;color:#000;border:1px solid #e0e8f0">Weighted</th>
      </tr></thead>
      <tbody>
        <tr><td style="${labelSt}">AC% Dev.</td>${devCols}<td style="${wCellSt}" id="acmt-w-dev">—</td></tr>
        <tr><td style="${labelSt}">Tonnage</td>${tonCols}<td style="${wCellSt}" id="acmt-w-ton">—</td></tr>
        <tr><td style="${labelSt}">AC Mass</td>${massCols}<td style="${wCellSt}" id="acmt-w-mass">—</td></tr>
        <tr><td style="${labelSt}">No. Tests</td>${testCols}<td style="${wCellSt}">${totalTests}</td></tr>
      </tbody>
    </table>
  </div>`;
}

function drawACChart(){
  const canvas=document.getElementById('ac-dev-chart');
  if(!canvas)return;
  if(acChartInst){acChartInst.destroy();acChartInst=null;}
  const recs=db.records.filter(r=>{
    if(r.testFamily!==acReportFamily||r.season!==acReportYear)return false;
    if(acReportMonth!==null){const mo=parseInt((r.dateSampled||r.date||'').slice(5,7));if(mo!==acReportMonth)return false;}
    return parseFloat(r.acContent)>0;
  }).sort((a,b)=>(a.dateSampled||a.date||'').localeCompare(b.dateSampled||b.date||''));
  const labels=recs.map(r=>{const d=r.dateSampled||r.date||'';return d.slice(5).replace('-','/');});
  const devData=recs.map(r=>{
    const jmf=r.jmfId?db.jmfs.find(j=>j.id===r.jmfId):null;
    const d=parseFloat(jmf?.acTarget),res=parseFloat(r.acContent);
    return(!isNaN(d)&&res>0)?parseFloat((res-d).toFixed(3)):null;
  });
  const barColors=devData.map(d=>d===null?'rgba(180,180,180,0.5)':Math.abs(d)>0.5?'rgba(192,57,43,0.75)':Math.abs(d)>0.3?'rgba(200,140,0,0.75)':'rgba(26,107,26,0.75)');
  const n=labels.length;
  const hline=(v,color,dash)=>({label:'',data:Array(n).fill(v),type:'line',borderColor:color,borderWidth:1.5,borderDash:dash,pointRadius:0,fill:false,tension:0});
  acChartInst=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'AC Deviation',data:devData,backgroundColor:barColors,borderColor:barColors.map(c=>c.replace('0.75','1')),borderWidth:1,order:2},
        hline(0,'rgba(31,56,100,0.9)',[]),
        hline(0.30,'rgba(200,140,0,0.6)',[5,4]),
        hline(-0.30,'rgba(200,140,0,0.6)',[5,4]),
        hline(0.50,'rgba(192,57,43,0.6)',[3,4]),
        hline(-0.50,'rgba(192,57,43,0.6)',[3,4]),
      ]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>{const v=ctx.raw;return v!==null?(v>=0?'+':'')+v.toFixed(2)+'%':'N/T';}}}
      },
      scales:{
        x:{ticks:{font:{size:10},maxRotation:55,autoSkip:true,maxTicksLimit:30},grid:{display:false},title:{display:true,text:'Date',font:{size:11}}},
        y:{ticks:{font:{size:11},callback:v=>(v>=0?'+':'')+v.toFixed(2)+'%'},grid:{color:'rgba(0,0,0,0.05)'},title:{display:true,text:'AC Deviation (%)',font:{size:11}}}
      }
    }
  });
}

// ── PDF EXTRACTION ─────────────────────────────────────────────────────────────
let apiKey = (localStorage.getItem('cp_api_key') || '').trim();

function showPdfStatus(type, msg) {
  const el = document.getElementById('pdf-status');
  if (!el) return;
  el.style.display = '';
  if (type === 'loading') {
    el.className = 'pdf-status-loading';
    el.innerHTML = '<span>⏳</span> ' + msg;
  } else if (type === 'error') {
    el.className = 'pdf-status-error';
    el.textContent = msg;
  } else {
    el.className = 'pdf-status-success';
    el.textContent = msg;
  }
}

function getApiKey(){
  if(apiKey) return apiKey;
  const k = prompt('Enter your Anthropic API key (starts with sk-ant-...):\nGet it from console.anthropic.com → API Keys');
  if(k && k.trim().startsWith('sk-')){
    apiKey=k.trim();
    localStorage.setItem('cp_api_key',apiKey);
    return apiKey;
  }
  return null;
}

function resetApiKey(){
  apiKey='';
  localStorage.removeItem('cp_api_key');
  localStorage.removeItem('cp_model');
  alert('API key cleared. Click Choose PDF to enter a new key.');
}

async function extractFromPDF(input){
  try {
    const file = input.files[0];
    if(!file) return;
    const key = getApiKey();
    if(!key){ showPdfStatus('error','API key required.'); return; }

    const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name);
    if(!isPDF && !isImage){ showPdfStatus('error','Unsupported file type. Please use a PDF or an image (JPG, PNG, HEIC, WebP).'); return; }
    if(isPDF && file.size > 32*1024*1024){ showPdfStatus('error','PDF is too large ('+Math.round(file.size/1024/1024)+'MB — limit is 32MB). Try exporting as JPEG from Preview instead: File → Export → Format: JPEG → Quality: High. A JPEG will be much smaller and works great.'); return; }
    if(isImage && file.size > 20*1024*1024){ showPdfStatus('error','Image is too large ('+Math.round(file.size/1024/1024)+'MB). In Preview: File → Export → Format: JPEG → Quality: High, then upload that file.'); return; }

    const isHEIC = /\.(heic|heif)$/i.test(file.name) || file.type === 'image/heic' || file.type === 'image/heif';
    showPdfStatus('loading',`Reading mix design ${isPDF?'PDF':isHEIC?'photo (converting HEIC…)':'photo'} — please wait about 10 seconds...`);

    let b64, mediaType;
    if(isPDF){
      b64 = await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>{const r=reader.result;const c=r.indexOf(',');resolve(c>=0?r.slice(c+1):r);};
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
      mediaType='application/pdf';
    } else if(isHEIC){
      // HEIC isn't accepted by the API — convert to JPEG via canvas
      try {
        const bitmap = await createImageBitmap(file);
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        bitmap.close();
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const comma = dataUrl.indexOf(',');
        b64 = dataUrl.slice(comma + 1);
      } catch(e) {
        throw new Error('HEIC could not be converted automatically.\n\nOn your Mac: open the photo in Preview → File → Export → choose JPEG → save. Then upload that JPEG file instead.');
      }
      mediaType='image/jpeg';
    } else {
      b64 = await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>{const r=reader.result;const c=r.indexOf(',');resolve(c>=0?r.slice(c+1):r);};
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
      mediaType=file.type||'image/jpeg';
    }

    const contentBlock = isPDF
      ? { type: 'document', source: { type: 'base64', media_type: mediaType, data: b64 } }
      : { type: 'image',    source: { type: 'base64', media_type: mediaType, data: b64 } };

    const systemPrompt = `You are extracting data from a Capital Paving mix design report (PDF or photo). Return ONLY a JSON object with no other text, no markdown, no backticks.

Fields to extract:
- mixDesignNo: Mix Design No. string in format PREFIX-YY-NN.N where PREFIX is SP/M/SMA (e.g. "SP-26-03.1", "M-25-04.1", "SMA-25-01.1")
- reportType: one of "Marshall", "Superpave", or "SMA"
- mixType: mix type string (e.g. "HL3", "SP 19 RAP", "SMA 12.5")
- trafficCategory: letter A-E for Superpave, null otherwise
- acTarget: AC% as number — this is the TOTAL AC content (the "%" or "% AC" column in the JMF table, NOT the "ACnew" column). For mixes with RAP, this total % AC includes both the new binder and the AC contributed by the RAP. It is typically the leftmost % AC value in the JMF row (e.g. 5.2, not the ACnew value of 4.5).
- airVoids: selected air voids % as number
- vma: selected VMA % as number
- gmb: Gmb at Ndes as number
- gmm: Gmm MRD as number
- gb: Gb specific gravity as number
- gsbBlend: combined Gsb as number
- binderGrade: PGAC grade string
- niniGyrations: Nini gyrations as integer or null
- ndesGyrations: Ndes gyrations as integer or null
- gradation: object with sieve sizes as keys, % passing as numbers. Keys must be from: "26.5","25.0","19.0","16.0","13.2","12.5","9.5","4.75","2.36","1.18","0.600","0.300","0.150","0.075". Use the JMF total row values only.
- designDate: the mix design approval or submission date in YYYY-MM-DD format, or null if not found.`;

    const body = JSON.stringify({
      model: localStorage.getItem('cp_model') || 'claude-haiku-4-5-20251001',
      max_tokens: 1500,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: [
          contentBlock,
          { type: 'text', text: 'Extract all fields from this mix design cover page. Return JSON only.' }
        ]
      }]
    });

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: body
    });

    const respText = await resp.text();

    if(!resp.ok) {
      let errMsg = 'API error ' + resp.status;
      try { const e = JSON.parse(respText); errMsg = e.error?.message || errMsg; } catch(e){}
      if(resp.status === 401){ apiKey=''; localStorage.removeItem('cp_api_key'); }
      showPdfStatus('error', errMsg);
      return;
    }

    let data;
    try { data = JSON.parse(respText); } catch(e) { showPdfStatus('error','Failed to parse API response'); return; }

    const rawText = (data.content || []).map(c => c.text || '').join('');
    const cleaned = rawText.replace(/```json/g,'').replace(/```/g,'').trim();

    let extracted;
    try { extracted = JSON.parse(cleaned); } catch(e) { showPdfStatus('error','Could not parse extracted data: ' + cleaned.slice(0,100)); return; }

    populateJMFForm(extracted);

  } catch(err) {
    showPdfStatus('error', 'Extraction failed: ' + err.message);
  }
}


function populateJMFForm(d){
  // Guard against recursion
  if(window._populating) return;
  window._populating = true;

  const fam = d.reportType === 'Marshall' ? 'Marshall' : d.reportType === 'SMA' ? 'SMA' : 'Superpave';

  const set = (id, val) => {
    const e = document.getElementById(id);
    if(e && val !== null && val !== undefined && val !== '') e.value = val;
  };

  // Fill fields that already exist on the form
  set('jf-mixdesignno', d.mixDesignNo);
  set('jf-actarget', d.acTarget);
  set('jf-vmatarget', d.vma);
  set('jf-gsb', d.gsbBlend);
  set('jf-gb', d.gb);
  set('jf-binder', d.binderGrade);
  set('jf-season', new Date().getFullYear().toString());
  set('jf-designdate', d.designDate||'');

  // Mix type dropdown
  const mtSel = document.getElementById('jf-mixtype');
  if(mtSel && d.mixType){
    const target = d.mixType.toLowerCase().replace(/\s+/g,'');
    let matched = false;
    for(let opt of mtSel.options){
      if(opt.value.toLowerCase().replace(/\s+/g,'') === target){
        mtSel.value=opt.value; matched=true; break;
      }
    }
    if(!matched){
      const first = d.mixType.split(' ')[0].toLowerCase();
      for(let opt of mtSel.options){
        if(opt.value.toLowerCase().includes(first)){mtSel.value=opt.value;break;}
      }
    }
  }

  // Traffic category + gyrations
  if(d.trafficCategory){
    const tc = document.getElementById('jf-trafficcat');
    if(tc){ tc.value=d.trafficCategory; updateGyrations(); }
  }

  // SMA gyrations
  if(fam==='SMA'){
    set('jf-sma-nini', d.niniGyrations||7);
    set('jf-sma-ndes', d.ndesGyrations||75);
  }

  // Gradation sieves
  if(d.gradation){
    Object.entries(d.gradation).forEach(([sieve,pct])=>{
      set('jg-'+sieve, pct);
    });
  }

  showPdfStatus('success',
    `✓ Extracted: ${d.mixDesignNo||''} — ${d.mixType||''} — AC: ${d.acTarget||''}% — VMA: ${d.vma||''}% — Gsb: ${d.gsbBlend||''} — Review all fields and save`
  );

  window._populating = false;
}
